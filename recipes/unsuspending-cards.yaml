id: unsuspending-cards
title: "Unsuspending & Unburying Cards"
intro: Locate suspended or buried cards in the Browser and restore them to your study queue.
target_doc: docs/guides/unsuspending-cards.md

setup:
  - action: close_dialogs
  - action: reset_to_decks
  - action: resize_window
    window: main
    width: 1024
    height: 700
  - action: wait
    ms: 300

steps:
  - title: "Step 01: Filter by is:suspended in the Browser"
    output: step-01-browser-is-suspended.webp
    window: active_dialog
    pre_actions:
      - action: open_dialog
        name: Browser
      - action: setup_browser
        search: "is:suspended"
      - action: resize_window
        window: active_dialog
        width: 1024
        height: 700
      - action: wait
        ms: 300
    locate:
      mode: qt_widget
      class_name: QComboBox
      padding: 4
      required: true
    highlight:
      color: "#FF5A36"
      badge: "1"
      badge_position: "bottom-right"
    caption: |
      Open **Browse** (`B`) and type `is:suspended` (or `is:buried`) in the search bar to list hidden cards.

  - title: "Step 02: Toggle Suspend from the Cards Menu"
    output: step-02-toggle-suspend.webp
    window: active_dialog
    pre_actions:
      - action: open_menu_and_locate
        window: active_dialog
        menu: "Cards"
        item: "Toggle Suspend"
    locate:
      mode: menu_item
      window: active_dialog
      menu: "Cards"
      item: "Toggle Suspend"
      padding: 4
      required: true
    highlight:
      color: "#FF5A36"
      badge: "2"
      badge_position: "right"
    caption: |
      Select the cards and click **Cards > Toggle Suspend** (or press `Ctrl+J`). For buried cards, you can also click **Unbury** on the Deck Overview screen.
    post_actions:
      - action: close_dialogs
      - action: reset_to_decks
