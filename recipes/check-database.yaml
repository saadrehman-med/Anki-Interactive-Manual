id: check-database
title: Checking Your Collection Database
intro: Verify collection integrity, rebuild internal structures, and clean unused tags via Check Database.
target_doc: docs/manual/files.md
insert_after: "## Checking Your Collection"

setup:
  - action: close_dialogs
  - action: reset_to_decks
  - action: resize_window
    window: main
    width: 1024
    height: 700
  - action: wait
    ms: 300

steps:
  - title: "Step 01: Open Tools > Check Database"
    output: step-01-check-database.webp
    window: main
    locate:
      mode: menu_item
      menu: Tools
      item: Check Database
      padding: 4
      required: true
    highlight:
      color: "#FF5A36"
      badge: "1"
      badge_position: "right"
    caption: |
      Open **Tools > Check Database** from the top menu bar to check for database corruption, optimize storage, and clear unused tags.
    post_actions:
      - action: close_dialogs
