id: empty-cards-and-menus
title: Cleaning Up Empty Cards
intro: Remove cards whose front template renders blank using Tools > Empty Cards.
target_doc: docs/manual/misc.md
insert_after: "## Menu Shortcuts"

setup:
  - action: close_dialogs
  - action: reset_to_decks
  - action: resize_window
    window: main
    width: 1024
    height: 700
  - action: wait
    ms: 300

steps:
  - title: "Step 01: Open Tools > Empty Cards"
    output: step-01-tools-empty-cards.webp
    window: main
    locate:
      mode: menu_item
      menu: Tools
      item: Empty Cards
      padding: 4
      required: true
    highlight:
      color: "#FF5A36"
      badge: "1"
      badge_position: "right"
    caption: |
      Choose **Tools > Empty Cards...** from the top menu bar to scan your collection for blank cards and remove them safely.
    post_actions:
      - action: close_dialogs
