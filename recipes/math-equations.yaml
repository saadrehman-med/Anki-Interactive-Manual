id: math-equations
title: Inserting MathJax Equations
intro: Use the editor's Equations menu to insert inline or block MathJax and LaTeX formulas.
target_doc: docs/manual/math.md
insert_after: "## MathJax"

setup:
  - action: close_dialogs
  - action: reset_to_decks

steps:
  - title: "Step 01: Click the Equations Menu in the Editor"
    output: step-01-equations-button.webp
    window: active_dialog
    pre_actions:
      - action: setup_add_cards
        model: "Basic"
        deck: "Demo deck"
        fields:
          Front: 'Find the roots of \(ax^2 + bx + c = 0\).'
          Back: '\[x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}\]'
      - action: resize_window
        window: active_dialog
        width: 820
        height: 620
      - action: wait
        ms: 300
    locate:
      mode: web
      selector: 'button[title="Equations"]'
      padding: 6
      required: true
    highlight:
      color: "#FF5A36"
      badge: "1"
    caption: |
      Click the **Equations** (`fx`) button in the editor toolbar to insert **MathJax inline** (`\(...\)`), **MathJax block** (`\[...\]`), or **LaTeX** delimiters.
    post_actions:
      - action: close_dialogs
