id: moving-and-renaming-decks
title: Creating Subdecks & Moving Cards
intro: Create a nested subdeck with `::` notation, move cards in the Browser, and rename decks from the gear menu.
target_doc: docs/guides/moving-and-renaming-decks.md

setup:
  - action: close_dialogs
  - action: ensure_deck
    name: "Demo deck::Subdeck"
  - action: reset_to_decks
  - action: resize_window
    window: main
    width: 1024
    height: 700
  - action: wait
    ms: 300

steps:
  - title: "Step 01: Create a Nested Subdeck"
    output: step-01-create-deck.webp
    window: main
    locate:
      mode: web
      web: bottom
      selector: button
      text: Create Deck
      padding: 8
      required: true
    highlight:
      color: "#FF5A36"
      badge: "1"
    caption: |
      Click **Create Deck** at the bottom of the Decks screen and enter a `Parent::Child` name such as `Demo deck::Subdeck` to nest it inside **Demo deck**.

  - title: "Step 02: Move Selected Cards via Cards > Change Deck"
    output: step-02-change-deck-menu.webp
    window: active_dialog
    pre_actions:
      - action: setup_browser
        search: 'deck:"Demo deck"'
        select_first: true
      - action: resize_window
        window: active_dialog
        width: 1024
        height: 700
      - action: wait
        ms: 250
    locate:
      mode: menu_item
      window: active_dialog
      menu: Cards
      item: Change Deck
      padding: 4
      required: true
    highlight:
      color: "#FF5A36"
      badge: "2"
      badge_position: "right"
    caption: |
      Open the **Browser** (<kbd>B</kbd>), select the cards you want to move, and choose **Cards > Change Deck...** (<kbd>Ctrl</kbd>+<kbd>D</kbd>).

  - title: "Step 03: Rename or Manage a Deck from the Gear Menu"
    output: step-03-deck-gear-rename.webp
    window: main
    pre_actions:
      - action: close_dialogs
      - action: wait
        ms: 300
      - action: reset_to_decks
      - action: wait_for
        mode: web
        web: deckBrowser
        selector: 'a[onclick*="opts:"]'
        timeout_ms: 5000
      - action: wait
        ms: 300
    locate:
      mode: web
      web: deckBrowser
      selector: 'a[onclick*="opts:"]'
      padding: 8
      required: true
    highlight:
      color: "#FF5A36"
      badge: "3"
      badge_position: "right"
    caption: |
      Click the gear icon next to any deck to **Rename** it (you can also add or remove `::` nesting here) or **Delete** an empty deck.
    post_actions:
      - action: delete_deck
        name: "Demo deck::Subdeck"
      - action: reset_to_decks
