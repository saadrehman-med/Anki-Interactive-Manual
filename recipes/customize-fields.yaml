id: customize-fields
title: Customizing Fields on a Note Type
intro: Add, rename, or reorder fields and adjust editing font settings for a note type.
target_doc: docs/manual/templates/fields.md
insert_after: "## Basic Replacements"

setup:
  - action: close_dialogs
  - action: reset_to_decks

steps:
  - title: "Step 01: Click Fields... in the Editor"
    output: step-01-open-fields.webp
    window: active_dialog
    pre_actions:
      - action: setup_add_cards
        model: "Basic"
        deck: "Demo deck"
      - action: resize_window
        window: active_dialog
        width: 820
        height: 620
      - action: wait
        ms: 300
    locate:
      mode: web
      selector: 'button[title="Customize Fields"]'
      padding: 6
      required: true
    highlight:
      color: "#FF5A36"
      badge: "1"
    caption: |
      Click **Fields...** in the Add or Browse editor toolbar to open the Fields dialog for the current note type.

  - title: "Step 02: Add, Rename, or Reposition Fields"
    output: step-02-fields-dialog.webp
    window: active_dialog
    pre_actions:
      - action: open_fields_dialog
      - action: wait
        ms: 300
    locate:
      mode: qt_widget
      object_name: fieldAdd
      padding: 6
      required: true
    highlight:
      color: "#FF5A36"
      badge: "2"
    caption: |
      Use **Add**, **Delete**, **Rename**, and **Reposition** to manage fields, and customize the **Editing Font** or options below before saving.
    post_actions:
      - action: close_dialogs
