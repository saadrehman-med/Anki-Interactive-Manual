id: browsing-find-and-replace
title: Finding & Replacing Text or Duplicates
intro: Locate Find and Replace and Find Duplicates in the Browser's Notes menu.
target_doc: docs/manual/browsing.md
insert_after: "## Find and Replace"

setup:
  - action: close_dialogs
  - action: reset_to_decks

steps:
  - title: "Step 01: Open Notes > Find and Replace"
    output: step-01-find-and-replace.webp
    window: active_dialog
    pre_actions:
      - action: setup_browser
        search: 'deck:"Demo deck"'
        select_first: true
      - action: resize_window
        window: active_dialog
        width: 1080
        height: 700
      - action: wait
        ms: 300
    locate:
      mode: menu_item
      window: active_dialog
      menu: Notes
      item: Find and Replace
      padding: 4
      required: true
    highlight:
      color: "#FF5A36"
      badge: "1"
      badge_position: "right"
    caption: |
      Select the notes to update in the Browser, then open **Notes > Find and Replace...** (or press <kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>F</kbd>).

  - title: "Step 02: Check Notes > Find Duplicates"
    output: step-02-find-duplicates.webp
    window: active_dialog
    pre_actions:
      - action: close_dialogs
      - action: setup_browser
        search: 'deck:"Demo deck"'
        select_first: true
      - action: resize_window
        window: active_dialog
        width: 1080
        height: 700
      - action: wait
        ms: 250
    locate:
      mode: menu_item
      window: active_dialog
      menu: Notes
      item: Find Duplicates
      padding: 4
      required: true
    highlight:
      color: "#FF5A36"
      badge: "2"
      badge_position: "right"
    caption: |
      You can also choose **Notes > Find Duplicates...** from the same menu to scan a field for repeated entries across notes.
    post_actions:
      - action: close_dialogs
