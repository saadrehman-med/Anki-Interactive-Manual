id: manage-addons
title: Managing Add-ons
intro: Install, configure, toggle, or inspect files for Anki add-ons from the Add-ons dialog.
target_doc: docs/manual/addons.md

setup:
  - action: close_dialogs
  - action: reset_to_decks
  - action: resize_window
    window: main
    width: 1024
    height: 700
  - action: wait
    ms: 300

steps:
  - title: "Step 01: Open Tools > Add-ons"
    output: step-01-tools-addons.webp
    window: main
    locate:
      mode: menu_item
      menu: Tools
      item: Add-ons
      padding: 4
      required: true
    highlight:
      color: "#FF5A36"
      badge: "1"
      badge_position: "right"
    caption: |
      From the main menu bar, choose **Tools > Add-ons** (or press <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>A</kbd>).

  - title: "Step 02: Install or Configure Add-ons"
    output: step-02-addons-dialog.webp
    window: active_dialog
    pre_actions:
      - action: close_dialogs
      - action: open_dialog
        name: AddonsDialog
      - action: wait
        ms: 300
    locate:
      mode: qt_widget
      object_name: getAddons
      padding: 6
      required: true
    highlight:
      color: "#FF5A36"
      badge: "2"
    caption: |
      Click **Get Add-ons...** to install by AnkiWeb code, or select an installed add-on to use **Config**, **View Files**, **Toggle Enabled**, or **Delete**.
    post_actions:
      - action: close_dialogs
