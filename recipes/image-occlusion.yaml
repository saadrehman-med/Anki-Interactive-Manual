id: image-occlusion
title: Creating an Image Occlusion Note
intro: Use Anki's built-in Image Occlusion note type to hide labels on diagrams and images.
target_doc: docs/manual/editing.md
insert_after: "## Image Occlusion"

setup:
  - action: close_dialogs
  - action: reset_to_decks

steps:
  - title: "Step 01: Select the Image Occlusion Note Type"
    output: step-01-io-type.webp
    window: active_dialog
    pre_actions:
      - action: setup_add_cards
        model: "Image Occlusion"
        deck: "Demo deck"
      - action: resize_window
        window: active_dialog
        width: 860
        height: 640
      - action: wait
        ms: 350
    locate:
      mode: qt_widget
      class_name: QPushButton
      text: "Image Occlusion"
      padding: 6
      required: true
    highlight:
      color: "#FF5A36"
      badge: "1"
    caption: |
      Click the **Type** button in the Add window and choose **Image Occlusion**.

  - title: "Step 02: Load an Image into the Editor"
    output: step-02-io-select-image.webp
    window: active_dialog
    locate:
      mode: web
      selector: button.io-image-picker-button
      text: Select Image
      padding: 8
      required: true
    highlight:
      color: "#FF5A36"
      badge: "2"
    caption: |
      Click **Select Image** to browse for an image file, or **Paste Image from Clipboard** to paste a copied diagram, then draw occlusion shapes over the parts to test.
    post_actions:
      - action: close_dialogs
