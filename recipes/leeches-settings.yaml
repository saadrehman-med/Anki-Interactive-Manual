id: leeches-settings
title: Configuring Leech Settings
intro: Adjust how many lapses mark a card as a leech and whether Anki tags or suspends it automatically.
target_doc: docs/manual/leeches.md
insert_after: "## Waiting"

setup:
  - action: close_dialogs
  - action: reset_to_decks

steps:
  - title: "Step 01: Open Deck Options for Demo deck"
    output: step-01-deck-options-leech.webp
    window: active_dialog
    pre_actions:
      - action: open_deck_options
        deck: "Demo deck"
      - action: resize_window
        window: active_dialog
        width: 880
        height: 720
      - action: wait
        ms: 300
    locate:
      mode: web
      text: Leech threshold
      padding: 8
      required: true
    highlight:
      color: "#FF5A36"
      badge: "1"
    caption: |
      Open **Deck Options** (<kbd>O</kbd>) and scroll to **Lapses**. Set **Leech threshold** (number of lapses before flagging) and **Leech action** (**Suspend Card** or **Tag Only**).
    post_actions:
      - action: close_dialogs
