id: addressing-backlog
title: Setting Up a Nested Backlog Catchup Deck
intro: Pause new cards, isolate overdue reviews with Descending Retrievability, and cap your daily backlog pace from an empty parent deck.
target_doc: docs/guides/addressing-backlog.md

setup:
  - action: close_dialogs
  - action: set_col_config
    key: fsrs
    value: true
  - action: ensure_deck
    name: "Demo deck::Catchup"
  - action: reset_to_decks
  - action: resize_window
    window: main
    width: 1024
    height: 700
  - action: wait
    ms: 300

steps:
  - title: "Step 01: Set New Cards/Day to Zero"
    output: step-01-pause-new-cards.webp
    window: active_dialog
    pre_actions:
      - action: open_deck_options
        deck: "Demo deck"
      - action: resize_window
        window: active_dialog
        width: 880
        height: 720
      - action: wait
        ms: 350
    locate:
      mode: web
      text: New cards/day
      padding: 8
      required: true
    highlight:
      color: "#FF5A36"
      badge: "1"
    caption: |
      Open **Options** for **Demo deck**, go to **Daily Limits**, and set **New cards/day** to `0` until your overdue backlog clears.

  - title: "Step 02: Create an Empty Wrapper Subdeck"
    output: step-02-wrapper-deck.webp
    window: main
    pre_actions:
      - action: close_dialogs
      - action: reset_to_decks
      - action: wait
        ms: 700
    locate:
      mode: web
      web: bottom
      selector: button
      text: Create Deck
      padding: 8
      required: true
    highlight:
      color: "#FF5A36"
      badge: "2"
    caption: |
      Click **Create Deck** at the bottom of the Decks screen and name an empty wrapper deck such as `Demo deck::Catchup` so you can collapse the backlog count and study from **Demo deck** in one click.

  - title: "Step 03: Gather Overdue Cards in a Nested Filtered Deck"
    output: step-03-filtered-overdue-search.webp
    window: active_dialog
    pre_actions:
      - action: close_dialogs
      - action: open_dialog
        name: FilteredDeck
      - action: set_filtered_deck_fields
        name: "Demo deck::Catchup::Overdue"
        search: 'deck:"Demo deck" is:due prop:due<=-1'
        limit: 9999
        order: "Descending Retrievability"
        resched: true
      - action: wait
        ms: 250
    locate:
      mode: qt_widget
      object_name: search
      padding: 6
      required: true
    highlight:
      color: "#FF5A36"
      badge: "3"
    caption: |
      Open **Tools > Create Filtered Deck...**, name it `Demo deck::Catchup::Overdue` so it nests inside your wrapper deck, enter `deck:"Demo deck" is:due prop:due<=-1`, raise the **Limit**, and keep rescheduling enabled.

  - title: "Step 04: Select Descending Retrievability Order"
    output: step-04-descending-retrievability.webp
    window: active_dialog
    locate:
      mode: qt_widget
      class_name: QComboBox
      padding: 6
      required: true
    highlight:
      color: "#FF5A36"
      badge: "4"
      badge_position: "bottom-right"
    caption: |
      Change **cards selected by** to **Descending Retrievability** so Anki tackles easier overdue cards first while working down your backlog, then click **Build**.

  - title: "Step 05: Cap Your Daily Allowance on the Wrapper Deck"
    output: step-05-parent-review-allowance.webp
    window: active_dialog
    pre_actions:
      - action: close_dialogs
      - action: open_deck_options
        deck: "Demo deck::Catchup"
      - action: resize_window
        window: active_dialog
        width: 880
        height: 720
      - action: wait
        ms: 350
    locate:
      mode: web
      text: Maximum reviews/day
      padding: 8
      required: true
    highlight:
      color: "#FF5A36"
      badge: "5"
    caption: |
      Open **Options** on the empty wrapper deck (`Demo deck::Catchup`), switch to **This deck**, and set **Maximum reviews/day** to your daily backlog quota. On days you want extra backlog cards, raise **Today only** instead of rebuilding the Filtered Deck.
    post_actions:
      - action: close_dialogs
      - action: delete_deck
        name: "Demo deck::Catchup"
      - action: set_col_config
        key: fsrs
        value: false
      - action: reset_to_decks
