id: card-generation-options
title: Adding and Managing Card Types
intro: Use the Card Types Options menu to add, rename, or remove card templates generated from a single note.
target_doc: docs/manual/templates/generation.md
insert_after: "## Card Generation & Deletion"

setup:
  - action: close_dialogs
  - action: reset_to_decks

steps:
  - title: "Step 01: Open Card Types and Click Options"
    output: step-01-card-types-options.webp
    window: active_dialog
    pre_actions:
      - action: setup_add_cards
        model: "Basic"
        deck: "Demo deck"
        fields:
          Front: "What is the chemical symbol for Gold?"
          Back: "Au"
      - action: open_card_layout
      - action: resize_window
        window: active_dialog
        width: 960
        height: 620
      - action: wait
        ms: 300
    locate:
      mode: qt_widget
      object_name: templateOptions
      padding: 6
      required: true
    highlight:
      color: "#FF5A36"
      badge: "1"
    caption: |
      In the **Cards...** (<kbd>Ctrl</kbd>+<kbd>L</kbd>) dialog, click **Options ▼** in the top-right to **Add Card Type**, **Remove Card Type**, or change **Deck Override**.
    post_actions:
      - action: close_dialogs
