id: stats-card-info
title: Viewing Individual Card Info
intro: Inspect a specific card's review log, stability, difficulty, and interval history from the Browser's Cards menu.
target_doc: docs/manual/stats.md
insert_after: "## Card Info"

setup:
  - action: close_dialogs
  - action: reset_to_decks

steps:
  - title: "Step 01: Open Cards > Info in the Browser"
    output: step-01-cards-info.webp
    window: active_dialog
    pre_actions:
      - action: setup_browser
        search: 'deck:"Demo deck"'
        select_first: true
      - action: resize_window
        window: active_dialog
        width: 1080
        height: 700
      - action: wait
        ms: 350
    locate:
      mode: menu_item
      window: active_dialog
      menu: Cards
      item: Info
      padding: 4
      required: true
    highlight:
      color: "#FF5A36"
      badge: "1"
      badge_position: "right"
    caption: |
      In the Browser, select a card and open **Cards > Info...** (or press <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>I</kbd>; also available under **More > Card Info** during study).
    post_actions:
      - action: close_dialogs
