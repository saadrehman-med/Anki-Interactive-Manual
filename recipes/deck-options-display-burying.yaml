id: deck-options-display-burying
title: Display Order & Sibling Burying Options
intro: Control card presentation order and sibling burying inside Deck Options.
target_doc: docs/manual/deck-options.md
insert_after: "## Display Order"

setup:
  - action: close_dialogs
  - action: reset_to_decks

steps:
  - title: "Step 01: Configure Display Order"
    output: step-01-display-order.webp
    window: active_dialog
    pre_actions:
      - action: open_deck_options
        deck: "Demo deck"
      - action: resize_window
        window: active_dialog
        width: 880
        height: 720
      - action: wait
        ms: 300
    locate:
      mode: web
      text: Display Order
      padding: 8
      required: true
    highlight:
      color: "#FF5A36"
      badge: "1"
    caption: |
      Scroll to **Display Order** to customize **New card gather order**, **New card sort order**, **New/review order**, and **Review sort order**.

  - title: "Step 02: Toggle Sibling Burying"
    output: step-02-burying.webp
    window: active_dialog
    locate:
      mode: web
      text: Burying
      padding: 8
      required: true
    highlight:
      color: "#FF5A36"
      badge: "2"
    caption: |
      Scroll down to **Burying** to delay related sibling cards (such as Cloze c1/c2 or Front/Back pairs) until the next day.
    post_actions:
      - action: close_dialogs
