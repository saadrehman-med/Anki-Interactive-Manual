id: browsing-manage-cards
title: Using the Card Browser
intro: Switch between Cards and Notes modes, navigate the sidebar, and edit or preview items directly in the Browser.
target_doc: docs/manual/browsing.md
insert_after: "## Table Modes"

setup:
  - action: close_dialogs
  - action: reset_to_decks

steps:
  - title: "Step 01: Open the Card Browser"
    output: step-01-browser-overview.webp
    window: active_dialog
    pre_actions:
      - action: setup_browser
        search: 'deck:"Demo deck"'
        select_first: true
      - action: resize_window
        window: active_dialog
        width: 1080
        height: 700
      - action: wait
        ms: 350
    locate:
      mode: qt_widget
      object_name: tableView
      padding: 4
      required: true
    highlight:
      color: "#FF5A36"
      badge: "1"
    caption: |
      Open **Browse** (<kbd>B</kbd>) to view cards or notes in the table alongside the left filter sidebar and right editing pane.

  - title: "Step 02: Inspect or Edit Fields in the Right Pane"
    output: step-02-browser-editor.webp
    window: active_dialog
    locate:
      mode: qt_widget
      class_name: EditorWebView
      padding: 4
      required: true
    highlight:
      color: "#FF5A36"
      badge: "2"
    caption: |
      Selecting any row loads its fields in the editor pane, where you can edit text, attach media, or click **Cards...** / **Fields...**.
    post_actions:
      - action: close_dialogs
