id: changing-note-types
title: "Changing Note Types on Existing Cards"
intro: Convert existing notes to another note type in the Card Browser and map their fields.
target_doc: docs/guides/changing-note-types.md

setup:
  - action: close_dialogs
  - action: reset_to_decks
  - action: resize_window
    window: main
    width: 1024
    height: 700
  - action: wait
    ms: 300

steps:
  - title: "Step 01: Select Notes in the Browser"
    output: step-01-browser-select-notes.webp
    window: active_dialog
    pre_actions:
      - action: open_dialog
        name: Browser
      - action: setup_browser
        search: "deck:\"Demo deck\""
      - action: resize_window
        window: active_dialog
        width: 1024
        height: 700
      - action: wait
        ms: 300
    locate:
      mode: qt_widget
      class_name: QTableView
      padding: 4
      required: true
    highlight:
      color: "#FF5A36"
      badge: "1"
      badge_position: "top-left"
    caption: |
      Open **Browse** (`B`), filter to the deck or notes you want to convert, and select one or more rows.

  - title: "Step 02: Open Notes > Change Note Type..."
    output: step-02-notes-change-note-type.webp
    window: active_dialog
    pre_actions:
      - action: open_menu_and_locate
        window: active_dialog
        menu: "Notes"
        item: "Change Note Type"
    locate:
      mode: menu_item
      window: active_dialog
      menu: "Notes"
      item: "Change Note Type"
      padding: 4
      required: true
    highlight:
      color: "#FF5A36"
      badge: "2"
      badge_position: "right"
    caption: |
      Click **Notes > Change Note Type...** (or press `Ctrl+Shift+M`), pick the target note type, map each existing field to its destination field, and click **Save**.
    post_actions:
      - action: close_dialogs
      - action: reset_to_decks
