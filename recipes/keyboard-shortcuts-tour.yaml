id: keyboard-shortcuts-tour
title: "Navigating Anki with Keyboard Shortcuts"
intro: Jump between Decks, Add, Browse, Study, and Edit using single-key shortcuts.
target_doc: docs/guides/keyboard-shortcuts-tour.md

setup:
  - action: close_dialogs
  - action: reset_to_decks
  - action: resize_window
    window: main
    width: 1024
    height: 700
  - action: wait
    ms: 300

steps:
  - title: "Step 01: Decks & Top Toolbar (D, A, B, T, Y)"
    output: step-01-decks-toolbar.webp
    window: main
    locate:
      mode: web
      web: toolbar
      text: "Decks"
      padding: 6
      required: true
    highlight:
      color: "#FF5A36"
      badge: "1"
      badge_position: "bottom-right"
    caption: |
      From anywhere in the main window, press `D` for **Decks**, `A` for **Add**, `B` for **Browse**, `T` for **Stats**, or `Y` to **Sync**.

  - title: "Step 02: Open the Add Window (A)"
    output: step-02-add-cards.webp
    window: active_dialog
    pre_actions:
      - action: open_dialog
        name: AddCards
      - action: resize_window
        window: active_dialog
        width: 820
        height: 620
      - action: wait
        ms: 300
    locate:
      mode: qt_widget
      class_name: QPushButton
      text: "Add"
      padding: 6
      required: true
    highlight:
      color: "#FF5A36"
      badge: "2"
      badge_position: "top-left"
    caption: |
      Press `A` to open **Add** from the main window. Fill in your fields and click **Add** (or press `Ctrl+Enter`).

  - title: "Step 03: Open the Card Browser (B)"
    output: step-03-browse-cards.webp
    window: active_dialog
    pre_actions:
      - action: close_dialogs
      - action: wait
        ms: 200
      - action: open_dialog
        name: Browser
      - action: setup_browser
        search: "deck:\"Demo deck\""
      - action: resize_window
        window: active_dialog
        width: 1024
        height: 700
      - action: wait
        ms: 300
    locate:
      mode: qt_widget
      class_name: QComboBox
      padding: 4
      required: true
    highlight:
      color: "#FF5A36"
      badge: "3"
      badge_position: "bottom-right"
    caption: |
      Press `B` to open **Browse** and search, filter, or organize cards across your decks.

  - title: "Step 04: Start Studying (S)"
    output: step-04-study-screen.webp
    window: main
    pre_actions:
      - action: close_dialogs
      - action: wait
        ms: 300
      - action: reset_to_decks
      - action: start_study_session
        deck: "Demo deck"
      - action: wait
        ms: 400
    locate:
      mode: web
      web: bottom
      selector: "#ansbut"
      padding: 6
      required: true
    highlight:
      color: "#FF5A36"
      badge: "4"
      badge_position: "top-left"
    caption: |
      Press `S` from the Decks or Overview screen to start **Study**, then press `Space` to show the answer.

  - title: "Step 05: Edit the Current Card (E)"
    output: step-05-edit-button.webp
    window: main
    locate:
      mode: web
      web: bottom
      selector: 'button[onclick*="edit"]'
      padding: 6
      required: true
    highlight:
      color: "#FF5A36"
      badge: "5"
      badge_position: "top-left"
    caption: |
      While studying, press `E` (or click **Edit**) to open the current card's fields, or press `Ctrl+Z` to undo your last action.
    post_actions:
      - action: close_dialogs
      - action: reset_to_decks
