id: syncing-setup
title: Syncing with AnkiWeb
intro: Sync your collection and configure automatic sync and media options in Preferences.
target_doc: docs/manual/syncing.md
insert_after: "## Setup"

setup:
  - action: close_dialogs
  - action: reset_to_decks
  - action: resize_window
    window: main
    width: 1024
    height: 700
  - action: wait
    ms: 300

steps:
  - title: "Step 01: Click Sync in the Top Toolbar"
    output: step-01-toolbar-sync.webp
    window: main
    locate:
      mode: web
      web: toolbar
      selector: "#sync"
      padding: 8
      required: true
    highlight:
      color: "#FF5A36"
      badge: "1"
    caption: |
      Click **Sync** in the main toolbar (or press <kbd>Y</kbd>) to sign in with your AnkiWeb account and synchronize changes.

  - title: "Step 02: Configure Sync Options in Preferences"
    output: step-02-preferences-syncing.webp
    window: active_dialog
    pre_actions:
      - action: open_dialog
        name: Preferences
      - action: select_preferences_tab
        tab: Syncing
      - action: wait
        ms: 300
    locate:
      mode: qt_widget
      tab_text: Syncing
      padding: 6
      required: true
    highlight:
      color: "#FF5A36"
      badge: "2"
    caption: |
      Open **Tools > Preferences > Syncing** to toggle automatic syncing on open/close, media syncing, and periodic background media sync.
    post_actions:
      - action: close_dialogs
