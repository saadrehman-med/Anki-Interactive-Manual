id: troubleshooting-checks
title: Running Database and Display Checks
intro: Use Check Database and video driver settings in Preferences when troubleshooting errors or display glitches.
target_doc: docs/manual/troubleshooting.md

setup:
  - action: close_dialogs
  - action: reset_to_decks
  - action: resize_window
    window: main
    width: 1024
    height: 700
  - action: wait
    ms: 300

steps:
  - title: "Step 01: Run Tools > Check Database"
    output: step-01-check-db.webp
    window: main
    locate:
      mode: menu_item
      menu: Tools
      item: Check Database
      padding: 4
      required: true
    highlight:
      color: "#FF5A36"
      badge: "1"
      badge_position: "right"
    caption: |
      Run **Tools > Check Database** first to verify collection integrity and repair common scheduling or tag inconsistencies.

  - title: "Step 02: Switch Video Driver for Display Issues"
    output: step-02-video-driver.webp
    window: active_dialog
    pre_actions:
      - action: close_dialogs
      - action: open_dialog
        name: Preferences
      - action: select_preferences_tab
        tab: Appearance
      - action: wait
        ms: 250
    locate:
      mode: qt_widget
      object_name: video_driver
      padding: 6
      required: true
    highlight:
      color: "#FF5A36"
      badge: "2"
    caption: |
      If Anki shows a blank window or visual artifacts, open **Tools > Preferences > Appearance**, switch **Video driver** (for example, between Direct3D/ANGLE and OpenGL or Software), and restart Anki.
    post_actions:
      - action: close_dialogs
