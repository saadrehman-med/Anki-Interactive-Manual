id: using-flags
title: Using Colored Flags on Cards
intro: Flag individual cards during review or in the Card Browser and filter by flag color.
target_doc: docs/manual/editing.md
insert_after: "### Using Flags"

setup:
  - action: close_dialogs
  - action: reset_to_decks
  - action: resize_window
    window: main
    width: 1024
    height: 700
  - action: wait
    ms: 300

steps:
  - title: "Step 01: Flag a Card During Review (Ctrl+1–7)"
    output: step-01-study-more-flag.webp
    window: main
    pre_actions:
      - action: start_study_session
        deck: "Demo deck"
      - action: wait
        ms: 350
    locate:
      mode: web
      web: bottom
      selector: button
      text: More
      padding: 8
      required: true
    highlight:
      color: "#FF5A36"
      badge: "1"
      badge_position: "top-left"
    caption: |
      While reviewing, press <kbd>Ctrl</kbd>+<kbd>1–7</kbd> (or click **More ▼ > Flag**) to attach a colored flag icon to the upper-right area of the current card.

  - title: "Step 02: Filter by Flag Color in the Browser Sidebar"
    output: step-02-browser-flags-sidebar.webp
    window: active_dialog
    pre_actions:
      - action: reset_to_decks
      - action: setup_browser
        search: 'deck:"Demo deck"'
        select_first: true
      - action: resize_window
        window: active_dialog
        width: 1024
        height: 700
      - action: wait
        ms: 350
    locate:
      mode: qt_widget
      class_name: SidebarTreeView
      padding: 4
      required: true
    highlight:
      color: "#FF5A36"
      badge: "2"
      badge_position: "right"
    caption: |
      In the **Browse** (<kbd>B</kbd>) sidebar under **Flags**, click any flag color (**Red**, **Orange**, **Green**, **Blue**, **Pink**, **Turquoise**, **Purple**) or **No Flag** to filter matching cards—or right-click a flag to rename it.

  - title: "Step 03: Flag Cards via Cards > Flag"
    output: step-03-cards-flag-menu.webp
    window: active_dialog
    pre_actions:
      - action: open_menu_and_locate
        window: active_dialog
        menu: "Cards"
        item: "Flag"
    locate:
      mode: menu_item
      window: active_dialog
      menu: "Cards"
      item: "Flag"
      padding: 4
      required: true
    highlight:
      color: "#FF5A36"
      badge: "3"
      badge_position: "right"
    caption: |
      Select one or more cards in the Browser table and choose **Cards > Flag** (or press <kbd>Ctrl</kbd>+<kbd>1–7</kbd>) to set or clear their flag color.
    post_actions:
      - action: close_dialogs
      - action: reset_to_decks
