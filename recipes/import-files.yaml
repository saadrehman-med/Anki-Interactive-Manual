id: import-files
title: Importing Decks and Text Files
intro: Configure separators, duplicate matching, tags, field mapping, and packaged deck options on the built-in Import screen.
target_doc: docs/manual/importing/intro.md

setup:
  - action: close_dialogs
  - action: reset_to_decks
  - action: resize_window
    window: main
    width: 1024
    height: 700
  - action: wait
    ms: 300

steps:
  - title: "Step 01: Click Import File on the Decks Screen"
    output: step-01-import-button.webp
    window: main
    locate:
      mode: web
      web: bottom
      selector: button
      text: Import File
      padding: 8
      required: true
    highlight:
      color: "#FF5A36"
      badge: "1"
    caption: |
      Click **Import File** at the bottom of the Decks screen (or choose **File > Import...** / <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>I</kbd>).

  - title: "Step 02: Verify the Field Separator and HTML Option"
    output: step-02-file-separator.webp
    window: active_dialog
    pre_actions:
      - action: open_dialog
        name: Import
        file_path: "sample-import.csv"
      - action: resize_window
        window: active_dialog
        width: 880
        height: 740
      - action: wait
        ms: 400
      - action: web_eval
        window: active_dialog
        js: |
          (() => {
            const setSelect = (labelText, optionText) => {
              const items = Array.from(document.querySelectorAll('div, label'));
              for (const el of items) {
                const txt = (el.textContent || '').trim();
                if (!txt.startsWith(labelText)) continue;
                const sel = el.querySelector('select');
                if (sel) {
                  const opt = Array.from(sel.options).find(o => o.text.trim() === optionText);
                  if (opt) {
                    sel.value = opt.value;
                    sel.dispatchEvent(new Event('change', { bubbles: true }));
                    return true;
                  }
                }
              }
              return false;
            };
            setSelect('Note Type', 'Basic');
            setSelect('Deck', 'Demo deck');
            window.scrollTo(0, 0);
            return 'ok';
          })()
        settle_ms: 250
    locate:
      mode: web
      js: |
        (() => {
          const all = Array.from(document.querySelectorAll('div, label, span'));
          let best = null;
          let bestArea = Infinity;
          for (const el of all) {
            const t = (el.innerText || '').trim();
            if (!t.includes('Field separator')) continue;
            const r = el.getBoundingClientRect();
            if (r.width > 0 && r.height > 0 && r.height < 90 && (r.width * r.height) < bestArea) {
              best = el;
              bestArea = r.width * r.height;
            }
          }
          return best;
        })()
      scroll: false
      padding: 8
      required: true
    highlight:
      color: "#FF5A36"
      badge: "2"
      badge_position: "top-right"
    caption: |
      When importing a `.csv`, `.tsv`, or `.txt` file, check **Field separator** (`Comma`, `Semicolon`, `Tab`, `Space`, `Colon`, or `Pipe`), toggle **Allow HTML in fields** if your file contains HTML tags or `<br>`, and confirm the preview table separates columns cleanly.

  - title: "Step 03: Pick the Target Note Type and Deck"
    output: step-03-note-type-and-deck.webp
    window: active_dialog
    locate:
      mode: web
      text: Note Type
      padding: 8
      required: true
    highlight:
      color: "#FF5A36"
      badge: "3"
      badge_position: "top-right"
    caption: |
      Under **Import options**, choose which **Note Type** (such as `Basic` or `Cloze`) and destination **Deck** (`Demo deck`) the imported notes should use.

  - title: "Step 04: Set Existing Notes and Match Scope"
    output: step-04-existing-notes.webp
    window: active_dialog
    locate:
      mode: web
      text: Existing notes
      padding: 8
      required: true
    highlight:
      color: "#FF5A36"
      badge: "4"
      badge_position: "top-right"
    caption: |
      Choose how Anki handles notes whose first field matches existing notes (**Existing notes**: `Update`, `Preserve`, or `Duplicate`), and set **Match scope** to check duplicates across the entire **Note Type** or only **Notetype and Deck**.

  - title: "Step 05: Add Optional Tags on Import"
    output: step-05-tag-imported-notes.webp
    window: active_dialog
    locate:
      mode: web
      text: Tag all notes
      padding: 8
      required: true
    highlight:
      color: "#FF5A36"
      badge: "5"
      badge_position: "top-right"
    caption: |
      Enter tags in **Tag all notes** to label every imported note, or **Tag updated notes** to mark only notes that overwrote existing cards.

  - title: "Step 06: Map File Columns to Note Fields"
    output: step-06-field-mapping.webp
    window: active_dialog
    locate:
      mode: web
      text: Field mapping
      padding: 8
      required: true
    highlight:
      color: "#FF5A36"
      badge: "6"
      badge_position: "top-right"
    caption: |
      Scroll down to **Field mapping** to match each column in your file (`1`, `2`, etc.) to a note field (such as `Front`, `Back`, `Tags`, or `(Nothing)` to skip a column).

  - title: "Step 07: Review Packaged Deck (.apkg) Import Options"
    output: step-07-apkg-import-options.webp
    window: active_dialog
    pre_actions:
      - action: close_dialogs
      - action: open_dialog
        name: Import
        file_path: "demo-deck.apkg"
      - action: resize_window
        window: active_dialog
        width: 880
        height: 740
      - action: wait
        ms: 400
      - action: web_eval
        window: active_dialog
        js: |
          (() => {
            const btn = Array.from(document.querySelectorAll('summary, button, div, span')).find(
              el => (el.innerText || '').trim().endsWith('Updates') && el.getBoundingClientRect().height < 60
            );
            if (btn) btn.click();
            return Boolean(btn);
          })()
        settle_ms: 200
    locate:
      mode: web
      text: Import any learning progress
      padding: 8
      required: true
    highlight:
      color: "#FF5A36"
      badge: "7"
      badge_position: "top-right"
    caption: |
      When opening an `.apkg` deck package, choose whether to **Import any learning progress**, **Import any deck presets**, and expand **Updates** to control **Update notes** and **Update note types** (`If newer`, `Always`, or `Never`) plus **Merge note types**.

  - title: "Step 08: Click Import to Finish"
    output: step-08-click-import.webp
    window: active_dialog
    locate:
      mode: web
      selector: button.primary
      text: Import
      padding: 8
      scroll: false
      required: true
    highlight:
      color: "#FF5A36"
      badge: "8"
    caption: |
      Once your file or package options look right, click **Import** in the top-right corner to add the notes and cards to your collection.
    post_actions:
      - action: close_dialogs
