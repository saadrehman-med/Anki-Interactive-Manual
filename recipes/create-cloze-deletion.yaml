id: create-cloze-deletion
title: Creating a Cloze Deletion
intro: Use the Cloze note type to turn selected words into fill-in-the-blank flashcards.
target_doc: docs/manual/editing.md
insert_after: "## Cloze Deletion"

setup:
  - action: close_dialogs
  - action: reset_to_decks

steps:
  - title: "Step 01: Switch the Note Type to Cloze"
    output: step-01-cloze-type.webp
    window: active_dialog
    pre_actions:
      - action: setup_add_cards
        model: "Cloze"
        deck: "Demo deck"
        fields:
          Text: "The {{c1::Pacific Ocean}} is the largest ocean on Earth."
          Back Extra: "Covers roughly one-third of Earth's surface."
      - action: resize_window
        window: active_dialog
        width: 820
        height: 620
      - action: wait
        ms: 300
    locate:
      mode: qt_widget
      class_name: QPushButton
      text: "Cloze"
      padding: 6
      required: true
    highlight:
      color: "#FF5A36"
      badge: "1"
    caption: |
      Click the **Type** button in the top-left of the Add window and select **Cloze**.

  - title: "Step 02: Wrap Text Using the Cloze Deletion Button"
    output: step-02-cloze-button.webp
    window: active_dialog
    locate:
      mode: web
      selector: 'button[title*="Cloze deletion (new card)"]'
      padding: 6
      required: true
    highlight:
      color: "#FF5A36"
      badge: "2"
    caption: |
      Highlight the text you want to hide and click the **[...]** button (or press <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>C</kbd>) to wrap it in `{{c1::...}}`.

  - title: "Step 03: Preview or Add the Cloze Note"
    output: step-03-cloze-add.webp
    window: active_dialog
    locate:
      mode: qt_widget
      class_name: QPushButton
      text: "Add"
      padding: 8
      required: true
    highlight:
      color: "#FF5A36"
      badge: "3"
    caption: |
      Add optional context in **Back Extra**, then click **Add** to create your cloze card(s).
    post_actions:
      - action: close_dialogs
