id: searching-sidebar-filters
title: Building Searches from the Browser Toolbar
intro: Use the Browser's Search and Select buttons alongside the left sidebar to build filter queries without memorizing syntax.
target_doc: docs/manual/searching.md
insert_after: "## Tags, decks, cards and notes"

setup:
  - action: close_dialogs
  - action: reset_to_decks

steps:
  - title: "Step 01: Use the Search Helper Button & Filter Sidebar"
    output: step-01-browser-search-tool.webp
    window: active_dialog
    pre_actions:
      - action: setup_browser
        search: 'deck:"Demo deck"'
        select_first: true
      - action: resize_window
        window: active_dialog
        width: 1080
        height: 700
      - action: wait
        ms: 350
    locate:
      mode: qt_widget
      class_name: QToolButton
      text: "Search"
      padding: 6
      required: true
    highlight:
      color: "#FF5A36"
      badge: "1"
    caption: |
      Click **Search** next to the sidebar filter (or click **Decks**, **Flags**, **Card State**, or **Note Types** on the left) to insert search filters automatically.
    post_actions:
      - action: close_dialogs
