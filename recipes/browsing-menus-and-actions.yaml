id: browsing-menus-and-actions
title: Browser Menus & Card Preview
intro: Preview selected cards and access bulk note/card actions from the Browser toolbar and menus.
target_doc: docs/manual/browsing.md
insert_after: "## Menus and Actions"

setup:
  - action: close_dialogs
  - action: reset_to_decks

steps:
  - title: "Step 01: Preview a Selected Card in the Browser"
    output: step-01-browser-preview.webp
    window: active_dialog
    pre_actions:
      - action: setup_browser
        search: 'deck:"Demo deck"'
        select_first: true
      - action: resize_window
        window: active_dialog
        width: 1080
        height: 700
      - action: wait
        ms: 350
    locate:
      mode: web
      selector: 'button[title*="Preview Selected Card"]'
      padding: 6
      required: true
    highlight:
      color: "#FF5A36"
      badge: "1"
    caption: |
      Select any row in the Browser and click **Preview** (or press <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd>) to inspect how the card looks during study.

  - title: "Step 02: Use the Notes and Cards Menus"
    output: step-02-browser-notes-menu.webp
    window: active_dialog
    locate:
      mode: menu_item
      window: active_dialog
      menu: Notes
      item: Find and Replace
      padding: 4
      required: true
    highlight:
      color: "#FF5A36"
      badge: "2"
      badge_position: "right"
    caption: |
      Open the **Notes** or **Cards** menu at the top of the Browser to change decks, manage tags, flag/suspend cards, find duplicates, or run Find and Replace.
    post_actions:
      - action: close_dialogs
