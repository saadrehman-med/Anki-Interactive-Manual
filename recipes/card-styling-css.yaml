id: card-styling-css
title: Styling Cards with CSS
intro: Customize fonts, colors, alignment, and Night Mode styles across all cards of a note type.
target_doc: docs/manual/templates/styling.md
insert_after: "## Card Styling"

setup:
  - action: close_dialogs
  - action: reset_to_decks

steps:
  - title: "Step 01: Open Card Types and Select Styling"
    output: step-01-styling-tab.webp
    window: active_dialog
    pre_actions:
      - action: setup_add_cards
        model: "Basic"
        deck: "Demo deck"
        fields:
          Front: "What is the capital city of Japan?"
          Back: "Tokyo."
      - action: open_card_layout
      - action: resize_window
        window: active_dialog
        width: 960
        height: 620
      - action: click_qt_widget
        object_name: style_button
      - action: wait
        ms: 300
    locate:
      mode: qt_widget
      object_name: style_button
      padding: 6
      required: true
    highlight:
      color: "#FF5A36"
      badge: "1"
    caption: |
      In the **Cards...** (<kbd>Ctrl</kbd>+<kbd>L</kbd>) window, select the **Styling** radio button to edit the shared `.card` CSS rules while previewing live changes on the right.
    post_actions:
      - action: close_dialogs
