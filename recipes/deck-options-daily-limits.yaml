id: deck-options-daily-limits
title: Configuring Daily Limits
intro: Set per-preset, per-deck, or today-only limits for New cards/day and Maximum reviews/day.
target_doc: docs/manual/deck-options.md
insert_after: "## Daily Limits"

setup:
  - action: close_dialogs
  - action: reset_to_decks

steps:
  - title: "Step 01: Adjust New Cards/Day and Scope Tabs"
    output: step-01-new-cards-limit.webp
    window: active_dialog
    pre_actions:
      - action: open_deck_options
        deck: "Demo deck"
      - action: resize_window
        window: active_dialog
        width: 880
        height: 720
      - action: wait
        ms: 300
    locate:
      mode: web
      text: New cards/day
      padding: 8
      required: true
    highlight:
      color: "#FF5A36"
      badge: "1"
    caption: |
      Under **Daily Limits**, set **New cards/day** and choose whether the limit applies to the **Preset**, **This deck**, or **Today only**.

  - title: "Step 02: Set Maximum Reviews/Day"
    output: step-02-max-reviews-limit.webp
    window: active_dialog
    locate:
      mode: web
      text: Maximum reviews/day
      padding: 8
      required: true
    highlight:
      color: "#FF5A36"
      badge: "2"
    caption: |
      Configure **Maximum reviews/day** and optionally toggle **New cards ignore review limit** or **Limits start from top** right below.
    post_actions:
      - action: close_dialogs
