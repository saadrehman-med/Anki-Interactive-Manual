id: export-apkg
title: Exporting a Packaged Deck (.apkg)
intro: Export Demo deck or your entire collection as an Anki package for sharing or backup.
target_doc: docs/manual/exporting.md
insert_after: "## Packaged Decks"

setup:
  - action: close_dialogs
  - action: reset_to_decks
  - action: resize_window
    window: main
    width: 1024
    height: 700
  - action: wait
    ms: 300

steps:
  - title: "Step 01: Open File > Export"
    output: step-01-file-export.webp
    window: main
    locate:
      mode: menu_item
      menu: File
      item: Export
      padding: 4
      required: true
    highlight:
      color: "#FF5A36"
      badge: "1"
      badge_position: "right"
    caption: |
      In the main window, choose **File > Export...** (or press <kbd>Ctrl</kbd>+<kbd>E</kbd>).

  - title: "Step 02: Choose Format, Deck, and Export Options"
    output: step-02-export-dialog.webp
    window: active_dialog
    pre_actions:
      - action: close_dialogs
      - action: open_dialog
        name: Export
      - action: wait
        ms: 300
    locate:
      mode: qt_widget
      class_name: QPushButton
      text: "Export..."
      padding: 8
      required: true
    highlight:
      color: "#FF5A36"
      badge: "2"
    caption: |
      Select **Anki Deck Package (.apkg)** under **Export format**, choose **Demo deck** under **Include**, verify **Include media** / scheduling options, and click **Export...**.
    post_actions:
      - action: close_dialogs
