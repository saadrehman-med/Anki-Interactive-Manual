id: card-templates
title: Editing Card Templates
intro: Open the Card Types window to edit Front/Back templates, CSS styling, and inspect live card previews.
target_doc: docs/manual/templates/intro.md
insert_after: "## The Templates Screen"

setup:
  - action: close_dialogs
  - action: reset_to_decks

steps:
  - title: "Step 01: Click Cards... from the Editor"
    output: step-01-open-cards.webp
    window: active_dialog
    pre_actions:
      - action: setup_add_cards
        model: "Basic"
        deck: "Demo deck"
        fields:
          Front: "What is the chemical symbol for Gold?"
          Back: "Au"
      - action: resize_window
        window: active_dialog
        width: 820
        height: 620
      - action: wait
        ms: 300
    locate:
      mode: web
      selector: 'button[title*="Customize Card Templates"]'
      padding: 6
      required: true
    highlight:
      color: "#FF5A36"
      badge: "1"
    caption: |
      In the Add or Browse editor, click **Cards...** (or press <kbd>Ctrl</kbd>+<kbd>L</kbd>) to open the Card Types window.

  - title: "Step 02: Switch Between Front, Back, and Styling"
    output: step-02-template-tabs.webp
    window: active_dialog
    pre_actions:
      - action: open_card_layout
      - action: resize_window
        window: active_dialog
        width: 960
        height: 620
      - action: wait
        ms: 350
    locate:
      mode: qt_widget
      object_name: template_box
      padding: 6
      required: true
    highlight:
      color: "#FF5A36"
      badge: "2"
    caption: |
      Use the **Front Template**, **Back Template**, and **Styling** radio buttons on the left to customize how `{{Front}}` and `{{Back}}` fields render.

  - title: "Step 03: Inspect the Live Card Preview"
    output: step-03-template-preview.webp
    window: active_dialog
    locate:
      mode: qt_widget
      object_name: preview_box
      padding: 6
      required: true
    highlight:
      color: "#FF5A36"
      badge: "3"
    caption: |
      Check the live **Front Preview** / **Back Preview** on the right, then click **Save** to apply template updates.
    post_actions:
      - action: close_dialogs
